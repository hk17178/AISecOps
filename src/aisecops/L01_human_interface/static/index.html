<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AISECOPS · L05 Gateway 测试台</title>
<style>
  :root{--bg:#f4efe4;--paper:#fbf8f0;--ink:#33312b;--dim:#8c887b;--line:#e0d9c8;
        --terra:#b0512f;--sage:#6d7d57;--ochre:#bb8a3c;--clay:#9a8266;--paper2:#f7f2e7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Songti SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:Georgia,"Songti SC","Noto Serif SC",serif}
  .wrap{max-width:860px;margin:0 auto;padding:36px 24px 60px}
  header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px;display:flex;align-items:baseline;gap:14px}
  header h1{font-size:23px;font-weight:600;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:13px}
  header .sp{flex:1}
  .pill{font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--sage);border-color:var(--sage)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
  label{display:block;font-size:13px;color:var(--dim);letter-spacing:.5px;margin-bottom:6px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;padding:11px 13px;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:16px;margin-bottom:16px}
  .row>div:first-child{width:240px}.row>div:last-child{flex:1}
  .btn{padding:11px 22px;border:1px solid var(--terra);background:var(--terra);color:#fbf8f0;font:inherit;font-weight:500;font-size:15px;border-radius:8px;cursor:pointer;transition:background .15s,box-shadow .2s}
  .btn:hover{background:#9a4527;box-shadow:0 3px 12px rgba(176,81,47,.25)}
  .btn:disabled{opacity:.5;cursor:default}
  h3.sec{font-size:13px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
  #out{white-space:pre-wrap;background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:48px}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
  .meta div{background:var(--paper);padding:10px 14px}
  .meta .l{font-size:12px;color:var(--dim)}.meta .v{font-weight:600}.meta .v.t{color:var(--terra)}
  .hint{color:var(--dim);font-size:13px;margin-top:10px}
  .err{color:var(--terra)}
</style></head><body>
<div class="wrap">
  <header>
    <h1 class="serif">AISECOPS</h1><span class="sub">L05 Gateway 测试台</span>
    <span class="sp"></span><span class="pill ok" id="health">● 检测中</span>
  </header>

  <div class="card">
    <div class="row">
      <div><label>场景 scenario</label><input id="scenario" value="L07/alert_triage"></div>
      <div><label>提示词 prompt</label><textarea id="prompt">把这条告警分诊一下：主机 WIN-APP-07 在 5 分钟内对 6 台主机发起 PsExec，使用凭证 svc_backup。</textarea></div>
    </div>
    <button class="btn" id="go" onclick="callGateway()">调用 Gateway</button>
    <div class="hint">无 API Key 时走 stub（不烧 token）；在 <code>.env</code> 配 <code>LLM_API_KEY</code> 后即调真实 LLM。</div>
  </div>

  <div class="card">
    <h3 class="sec">响应</h3>
    <div id="out">（等待调用…）</div>
    <div class="meta" id="meta" style="display:none">
      <div><div class="l">provider</div><div class="v" id="m-prov">—</div></div>
      <div><div class="l">model</div><div class="v" id="m-model">—</div></div>
      <div><div class="l">是否降级</div><div class="v" id="m-fb">—</div></div>
      <div><div class="l">token 总量</div><div class="v" id="m-tok">—</div></div>
      <div><div class="l">成本 (¥)</div><div class="v t" id="m-cost">—</div></div>
      <div><div class="l">延迟 (ms)</div><div class="v" id="m-lat">—</div></div>
    </div>
  </div>
</div>
<script>
async function health(){
  const el=document.getElementById('health');
  try{const r=await fetch('/api/health');const d=await r.json();
    el.textContent = d.status==='ok' ? '● 服务在线' : '● 异常';}
  catch(e){el.textContent='● 离线';el.style.color='var(--terra)';el.style.borderColor='var(--terra)';}
}
async function callGateway(){
  const btn=document.getElementById('go'), out=document.getElementById('out'), meta=document.getElementById('meta');
  btn.disabled=true; out.classList.remove('err'); out.textContent='调用中…';
  try{
    const r=await fetch('/api/llm/call',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:document.getElementById('prompt').value, scenario:document.getElementById('scenario').value})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(), m=d.metadata;
    out.textContent=d.content;
    document.getElementById('m-prov').textContent=m.provider;
    document.getElementById('m-model').textContent=m.model;
    document.getElementById('m-fb').textContent=m.fallback_used?'是':'否';
    document.getElementById('m-tok').textContent=m.total_tokens;
    document.getElementById('m-cost').textContent=Number(m.cost_cny).toFixed(4);
    document.getElementById('m-lat').textContent=Number(m.latency_ms).toFixed(1);
    meta.style.display='grid';
  }catch(e){out.classList.add('err'); out.textContent='调用失败：'+e.message; meta.style.display='none';}
  finally{btn.disabled=false;}
}
health();
</script></body></html>
